<main
  class="min-h-screen w-full flex items-center justify-center px-4 sm:px-6 py-6 sm:py-12 overflow-y-auto"
>
  <div
    class="w-full max-w-sm sm:max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl my-auto"
  >
    <header class="text-center mb-6 sm:mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 mb-4">
        <img
          src="/D3.png"
          alt="Logo Desbravadores"
          class="w-full h-full object-contain drop-shadow"
        />
      </div>
      <h1
        class="text-2xl sm:text-3xl font-black tracking-widest bg-linear-to-r from-white via-slate-200 to-indigo-400 bg-clip-text text-transparent"
      >
        SIGADBV
      </h1>
      <p class="text-xs sm:text-sm text-slate-400 mt-2">
        Defina sua nova senha para continuar
      </p>
    </header>

    <!-- Componente Global de Erro Reutilizável -->
    <app-error-message [message]="errorMessage" />

    <form
      [formGroup]="updatePasswordForm"
      (ngSubmit)="onSubmit()"
      data-testid="form-update-password"
      class="space-y-4 sm:space-y-5"
    >
      <!-- Componente Input de Nova Senha -->
      <app-input-form
        id="password"
        type="password"
        formControlName="password"
        label="Nova Senha"
        testId="password-input"
        errorTestId="password-error"
        [showError]="!!(updatePasswordForm.get('password')?.touched && updatePasswordForm.get('password')?.invalid)"
        errorMessage="Senha inválida (mínimo de 8 caracteres)"
      />

      <!-- Componente Input de Confirmação de Senha -->
      <app-input-form
        id="confirmPassword"
        type="password"
        formControlName="confirmPassword"
        label="Confirmar Nova Senha"
        testId="confirm-password-input"
        errorTestId="confirm-password-error"
        [showError]="!!((updatePasswordForm.get('confirmPassword')?.touched || updatePasswordForm.hasError('mismatch')) && updatePasswordForm.invalid)"
        errorMessage="As senhas não coincidem"
      />

      <!-- Botão de Submit -->
      <app-button
        [disabled]="updatePasswordForm.invalid"
        [isLoading]="isLoading"
        loadingText="Atualizando..."
        testId="submit-btn"
      >
        Atualizar Senha
      </app-button>
    </form>
  </div>
</main>
