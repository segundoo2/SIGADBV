<main class="min-h-screen w-full flex items-center justify-center bg-slate-950 px-4 sm:px-6 py-6 sm:py-12 overflow-y-auto">
  <div class="w-full max-w-sm sm:max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl my-auto">
    
    <header class="text-center mb-6 sm:mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 mb-4">
        <img src="/D3.png" alt="Logo Desbravadores" class="w-full h-full object-contain drop-shadow" />
      </div>
      <h1 class="text-2xl sm:text-3xl font-black tracking-widest bg-linear-to-r from-white via-slate-200 to-indigo-400 bg-clip-text text-transparent">
        SIGADBV
      </h1>
      <p class="text-xs sm:text-sm text-slate-400 mt-2">Acesse sua conta para continuar</p>
    </header>

    <!-- Bloco de Erro Global com Transição Elegante -->
    <div class="transition-all duration-300 ease-in-out overflow-hidden"
         [class.max-h-40]="errorMessage"
         [class.max-h-0]="!errorMessage"
         [class.opacity-100]="errorMessage"
         [class.opacity-0]="!errorMessage"
         [class.mb-6]="errorMessage"
         [class.mb-0]="!errorMessage">
      <div
        data-testid="error-message"
        class="p-3 sm:p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-xs sm:text-sm font-medium flex items-center gap-3"
      >
        <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.92 3 1.732 3 z"
          />
        </svg>
        <span>{{ errorMessage }}</span>
      </div>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" data-testid="form-auth" class="space-y-4 sm:space-y-5">
      
      <!-- Componente Input de Usuário -->
      <app-input-form
        id="username"
        formControlName="username"
        label="Usuario"
        testId="username-input"
        errorTestId="username-error"
        [showError]="!!(loginForm.get('username')?.touched && loginForm.get('username')?.invalid)"
        errorMessage="Usuário inválido (mínimo de 3 caracteres)"
      />

      <!-- Componente Input de Senha -->
      <app-input-form
        id="password"
        type="password"
        formControlName="password"
        label="Senha"
        testId="password-input"
        errorTestId="password-error"
        [showError]="!!(loginForm.get('password')?.touched && loginForm.get('password')?.invalid)"
        errorMessage="Senha inválida (mínimo de 8 caracteres)"
      />

      <!-- Botão de Submit -->
      <button
        type="submit"
        data-testid="submit-btn"
        [disabled]="loginForm.invalid || loginForm.disabled"
        class="w-full mt-2 h-11 sm:h-12 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 disabled:bg-slate-800 disabled:text-slate-500 disabled:cursor-not-allowed text-white font-medium text-sm sm:text-base rounded-xl shadow-lg shadow-indigo-600/20 transition-all duration-200 flex items-center justify-center gap-2"
      >
        @if (isLoading) {
          <svg class="animate-spin -ml-1 mr-3 h-5 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>Autenticando...</span>
        } @else {
          <span>Acessar Sistema</span>
        }
      </button>
    </form>
  </div>
</main>
