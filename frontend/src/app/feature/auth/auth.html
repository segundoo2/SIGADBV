<main class="min-h-screen w-full flex items-center justify-center px-4 sm:px-6 py-6 sm:py-12 bg-slate-950">
  <article
    class="w-full max-w-sm sm:max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl"
  >
    <header class="text-center mb-6 sm:mb-8">
      <figure class="inline-flex items-center justify-center w-20 h-20 mb-4">
        <img
          src="/D3.png"
          alt="Logo Desbravadores"
          class="w-full h-full object-contain drop-shadow"
        />
      </figure>
      <h1
        class="text-2xl sm:text-3xl font-black tracking-widest bg-linear-to-r from-white via-slate-200 to-indigo-400 bg-clip-text text-transparent"
      >
        SIGADBV
      </h1>
      <p class="text-xs sm:text-sm text-slate-400 mt-2">
        Acesse sua conta para continuar
      </p>
    </header>

    <app-error-message [message]="errorMessage" />

    <form
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
      data-testid="form-auth"
      class="space-y-4 sm:space-y-5 flex flex-col mt-3"
    >
      <app-input-form
        id="username"
        formControlName="username"
        label="Usuario"
        testId="username-input"
        errorTestId="username-error"
        [showError]="!!(loginForm.get('username')?.touched && loginForm.get('username')?.invalid)"
        errorMessage="Usuário inválido (mínimo de 3 caracteres)"
      />

      <app-input-form
        id="password"
        type="password"
        formControlName="password"
        label="Senha"
        testId="password-input"
        errorTestId="password-error"
        [showError]="!!(loginForm.get('password')?.touched && loginForm.get('password')?.invalid)"
        errorMessage="Senha inválida (mínimo de 8 caracteres)"
      />

      <app-button
        [disabled]="loginForm.invalid"
        [isLoading]="isLoading"
        loadingText="Autenticando..."
        testId="submit-btn"
      >
        Acessar Sistema
      </app-button>
    </form>
  </article>
</main>
