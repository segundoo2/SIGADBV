<app-header />

<main class="p-6 max-w-7xl mx-auto">
  <header
    class="flex flex-col sm:flex-row justify-between sm:items-center gap-4 mb-6"
  >
    <div>
      <h1 class="text-2xl font-bold text-white">
        Bem-vindo, {{ currentUserEntity()?.username ?? '' }}!
      </h1>
      <p class="text-sm text-slate-400">
        Visualize o ranking de unidades e modere as solicitações de pontuação
        pendentes
      </p>
    </div>

    <app-card label="Unidades Cadastradas" [value]="totalUnitsCount()" />
  </header>

  <section class="mt-5 grid grid-cols-1 lg:grid-cols-2 gap-6 items-stretch">
    <app-access-denied-card
      [requiredPermission]="EPermission.UNIT_READ"
      message="Acesso restrito: você não possui permissão para visualizar o gráfico de pontuação geral."
    >
      <app-bar-chart-card
        class="h-full flex flex-col"
        title="Ranking de Unidade"
        [items]="chartItems()"
        emptyMessage="Não há dados suficientes para exibir o gráfico do ranking"
      />
    </app-access-denied-card>

    <app-access-denied-card
      [requiredPermission]="EPermission.SCORE_HISTORY_APPROVE"
      message="Acesso restrito: você não possui permissão para consultar e decidir solicitações de pontuação."
    >
      <app-pending-score-requests
        [items]="pendingItemsWithUnitName()"
        (approveRequested)="onApprove($event)"
        (rejectRequested)="onReject($event)"
      />
    </app-access-denied-card>
  </section>
</main>
