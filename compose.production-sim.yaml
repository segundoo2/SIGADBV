services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sigadbv_sim
      POSTGRES_USER: sigadbv_sim
      POSTGRES_PASSWORD: local-simulation-only
    volumes:
      - sigadbv-sim-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigadbv_sim -d sigadbv_sim"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://sigadbv_sim:local-simulation-only@database:5432/sigadbv_sim
      REDIS_URL: redis://redis:6379
      ALLOWED_ORIGINS: https://localhost:8443
      FRONTEND_URL: https://localhost:8443/
      JWT_SECRET: local-simulation-access-secret-32-bytes-minimum
      JWT_REFRESH_SECRET: local-simulation-refresh-secret-32-bytes-minimum
      ADMIN_USERNAME: sg.code
      ADMIN_PASSWORD: LocalTestPass123
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api-json').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 30

  frontend:
    build:
      context: ./frontend
    environment:
      SIMULATION_API_URL: https://localhost:8443/api
    ports:
      - "8443:443"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sigadbv-sim-postgres:
