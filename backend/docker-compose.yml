version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sigadbv_postgres
    restart: always
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sigadbv
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sigadbv_network

  redis:
    image: redis:7-alpine
    container_name: sigadbv_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sigadbv_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigadbv_api
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:
      - sigadbv_network

volumes:
  postgres_data:
  redis_data:

networks:
  sigadbv_network:
    driver: bridge